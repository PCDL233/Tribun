llm:
  provider: anthropic
  model: claude-sonnet-5
  apiKey: ${AI_REVIEW_API_KEY}
  maxTokensPerReview: 50000
  temperature: 0.1
  mockFixturesDir: .ai-review-cache/llm-fixtures
review:
  mode: fast
  dimensions:
    - correctness
    - security
    - performance
    - maintainability
  blockOn: BLOCKER
  ignorePatterns:
    - "*.lock"
    - pnpm-lock.yaml
    - dist/**
    - "*.min.js"
rag:
  enabled: true
  knowledgeBasePaths:
    - docs/
  indexDir: .ai-review-cache/vectors
  topK: 5
staticAnalysis:
  enabledTools:
    - ast_parse
    - complexity_check
    - secret_scan
    - dependency_scan
    - custom_rule_check
  complexityThreshold: 15
customRules: []
report:
  format: markdown
  outputDir: .ai-review-reports
  includePraise: true
logging:
  enabled: true
  console: true
  file: true
  dir: logs
  maxDays: 30
server:
  allowedRoots: []
  maxConcurrent: 3
  cookieSecure: false
  allowRegister: false
  trustProxy: false
  ollamaModel: qwen3-coder:30b
